name: Android APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.9 }
      - name: Build debug APK
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: gradle :app:assembleDebug --stacktrace
      - name: Verify APK artifact
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -n1)
          echo "APK: $APK"; ls -l "$APK"
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort | tail -n1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -n1)
          "$AAPT" dump badging "$APK" | grep -E "package:|sdkVersion|launchable-activity"
          "$APKSIGNER" verify --verbose "$APK"
          unzip -l "$APK" | grep -E "classes.*dex|AndroidManifest"
          if [ -z "$YT_API_KEY" ]; then echo "::warning::YT_API_KEY secret not set; app will show a 'no API key' message"; fi
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: RoohuX-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
